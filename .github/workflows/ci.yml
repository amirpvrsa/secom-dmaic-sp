name: tests-and-build

on:
  push:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      # keep the downloaded SECOM data between runs so UCI is hit only once
      - name: Cache SECOM data
        uses: actions/cache@v4
        with:
          path: data/cache
          key: secom-${{ hashFiles('config.yaml') }}

      # Use the original UCI files (they carry the timestamps). data.py reads them from
      # data/raw when present; otherwise it falls back to the ucimlrepo download.
      - name: Get SECOM original files from UCI
        if: hashFiles('data/cache/secom.csv.gz') == ''
        run: |
          curl -fsSL -o secom.zip https://archive.ics.uci.edu/static/public/179/secom.zip
          unzip -o secom.zip -d data/raw

      - name: Build report
        run: python run.py

      - name: Upload report and tables
        uses: actions/upload-artifact@v4
        with:
          name: secom-dmaic-report
          path: |
            outputs/*.html
            outputs/*.csv
            outputs/*.json
            outputs/figures/
